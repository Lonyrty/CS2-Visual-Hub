name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop.js'
      - 'server.js'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS2-Visual-Hub-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CS2 Visual Hub v1.0.${{ github.run_number }}
          body: |
            Windows installer for CS2 Visual Hub.

            - Press F8 to show or hide the companion overlay.
            - Press Esc to hide the overlay.
            - The app uses a separate desktop window and does not inject into CS2.
          files: release/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
