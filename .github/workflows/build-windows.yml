name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop.js'
      - 'server.js'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CS2-Visual-Hub-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
