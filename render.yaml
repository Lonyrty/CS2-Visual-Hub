services:
  - type: web
    name: cs2-visual-hub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OWNER_USERNAME
        value: lonyrty
      - key: CURRENCY
        value: eur
      - key: SESSION_SECRET
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: PRICE_7D_CENTS
        value: ""
      - key: PRICE_30D_CENTS
        value: ""
      - key: PRICE_90D_CENTS
        value: ""
      - key: PRICE_LIFETIME_CENTS
        value: ""
